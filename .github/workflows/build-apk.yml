name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version tag for release (e.g. v1.1.0)"
        required: false
        type: string

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore and Environment
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > my-upload-key.jks
            test -s my-upload-key.jks
          else
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore || true
            fi
            if [ ! -f "debug.keystore" ]; then
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          touch .env

      - name: Build Minified Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          GRADLE_ARGS="--no-daemon --stacktrace"
          if [ ! -f "$KEYSTORE_PATH" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            GRADLE_ARGS="$GRADLE_ARGS -Pandroid.injected.signing.store.file=${{ github.workspace }}/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android"
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease $GRADLE_ARGS
          else
            gradle assembleRelease $GRADLE_ARGS
          fi

      - name: Prepare Release Assets
        id: release_assets
        run: |
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            VERSION="${{ inputs.release_tag }}"
          else
            VERSION="v$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          mkdir -p release-assets
          OUT_APK="release-assets/Cloudyte-${VERSION}-release.apk"
          cp "$APK_PATH" "$OUT_APK"
          (cd release-assets && sha256sum "Cloudyte-${VERSION}-release.apk" > "Cloudyte-${VERSION}-release.apk.sha256")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cloudyte-${{ steps.release_assets.outputs.version }}-APK
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        with:
          artifacts: "release-assets/Cloudyte-*-release.apk,release-assets/Cloudyte-*-release.apk.sha256"
          tag: "${{ steps.release_assets.outputs.version }}"
          name: "Cloudyte ${{ steps.release_assets.outputs.version }}"
          generateReleaseNotes: true
          allowUpdates: true
          makeLatest: true
